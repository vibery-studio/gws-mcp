# Typecheck, the three test projects and the generated-SDK check. Needs no secret and no Cloudflare or Google
# account: the tests read the tracked wrangler.example.jsonc and talk only to the in-repo fake Google.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Tests (Workers runtime)
        run: npx vitest run --project workers
      - name: Tests (Node scripts)
        run: npx vitest run --project node
      - name: Tests (local mode)
        run: npx vitest run --project local
      - name: Generated SDK matches its pinned Discovery docs
        run: npm run gen:check
